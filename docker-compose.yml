services:
  postgres:
    image: ${STELE_POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: stele
      POSTGRES_PASSWORD: ${STELE_POSTGRES_PASSWORD:-stele-local-only}
      POSTGRES_DB: stele
    ports:
      - "${STELE_POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stele -d stele"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - stele-postgres-data:/var/lib/postgresql

  api:
    build:
      context: .
      args:
        STELE_GO_IMAGE: ${STELE_GO_IMAGE:-golang:1.25-bookworm}
        STELE_RUNTIME_IMAGE: ${STELE_RUNTIME_IMAGE:-debian:bookworm-slim}
        STELE_GOPROXY: ${STELE_GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    environment:
      STELE_MODE: api
      STELE_HTTP_ADDR: :8080
      STELE_POSTGRES_DSN: postgres://stele:${STELE_POSTGRES_PASSWORD:-stele-local-only}@postgres:5432/stele?sslmode=disable
      STELE_DATABASE_MIGRATION_POLICY: ${STELE_DATABASE_MIGRATION_POLICY:-auto}
      STELE_AUTH_BOOTSTRAP_ADMIN_KEY: ${STELE_AUTH_BOOTSTRAP_ADMIN_KEY:-local-bootstrap-admin-change-me}
      STELE_AUTH_DEFAULT_TENANT: ${STELE_AUTH_DEFAULT_TENANT:-tenant-a}
      STELE_AUTH_DEFAULT_PROJECT: ${STELE_AUTH_DEFAULT_PROJECT:-project-a}
      STELE_AUTH_DEFAULT_NAMESPACE: ${STELE_AUTH_DEFAULT_NAMESPACE:-namespace-a}
      STELE_JOBS_MAINTENANCE_INTERVAL: 30s
      STELE_JOBS_SUMMARY_COMPACTION_INTERVAL: 30s
      STELE_JOBS_RETENTION_INTERVAL: 30s
      STELE_JOBS_CLEANUP_INTERVAL: 30s
      STELE_JOBS_JOB_EXECUTION_RETENTION: 168h
      STELE_JOBS_WORKER_POLL_INTERVAL: 5s
      STELE_JOBS_WORKER_ERROR_BACKOFF: 15s
      STELE_JOBS_SCHEDULER_ERROR_BACKOFF: 30s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${STELE_HTTP_HOST_PORT:-8080}:8080"

  worker:
    build:
      context: .
      args:
        STELE_GO_IMAGE: ${STELE_GO_IMAGE:-golang:1.25-bookworm}
        STELE_RUNTIME_IMAGE: ${STELE_RUNTIME_IMAGE:-debian:bookworm-slim}
        STELE_GOPROXY: ${STELE_GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    environment:
      STELE_MODE: worker
      STELE_POSTGRES_DSN: postgres://stele:${STELE_POSTGRES_PASSWORD:-stele-local-only}@postgres:5432/stele?sslmode=disable
      STELE_DATABASE_MIGRATION_POLICY: ${STELE_DATABASE_MIGRATION_POLICY:-auto}
      STELE_AUTH_BOOTSTRAP_ADMIN_KEY: ${STELE_AUTH_BOOTSTRAP_ADMIN_KEY:-local-bootstrap-admin-change-me}
      STELE_AUTH_DEFAULT_TENANT: ${STELE_AUTH_DEFAULT_TENANT:-tenant-a}
      STELE_AUTH_DEFAULT_PROJECT: ${STELE_AUTH_DEFAULT_PROJECT:-project-a}
      STELE_AUTH_DEFAULT_NAMESPACE: ${STELE_AUTH_DEFAULT_NAMESPACE:-namespace-a}
      STELE_JOBS_MAINTENANCE_INTERVAL: 30s
      STELE_JOBS_SUMMARY_COMPACTION_INTERVAL: 30s
      STELE_JOBS_RETENTION_INTERVAL: 30s
      STELE_JOBS_CLEANUP_INTERVAL: 30s
      STELE_JOBS_JOB_EXECUTION_RETENTION: 168h
      STELE_JOBS_WORKER_POLL_INTERVAL: 5s
      STELE_JOBS_WORKER_ERROR_BACKOFF: 15s
      STELE_JOBS_SCHEDULER_ERROR_BACKOFF: 30s
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      args:
        STELE_GO_IMAGE: ${STELE_GO_IMAGE:-golang:1.25-bookworm}
        STELE_RUNTIME_IMAGE: ${STELE_RUNTIME_IMAGE:-debian:bookworm-slim}
        STELE_GOPROXY: ${STELE_GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    environment:
      STELE_MODE: scheduler
      STELE_POSTGRES_DSN: postgres://stele:${STELE_POSTGRES_PASSWORD:-stele-local-only}@postgres:5432/stele?sslmode=disable
      STELE_DATABASE_MIGRATION_POLICY: ${STELE_DATABASE_MIGRATION_POLICY:-auto}
      STELE_AUTH_BOOTSTRAP_ADMIN_KEY: ${STELE_AUTH_BOOTSTRAP_ADMIN_KEY:-local-bootstrap-admin-change-me}
      STELE_AUTH_DEFAULT_TENANT: ${STELE_AUTH_DEFAULT_TENANT:-tenant-a}
      STELE_AUTH_DEFAULT_PROJECT: ${STELE_AUTH_DEFAULT_PROJECT:-project-a}
      STELE_AUTH_DEFAULT_NAMESPACE: ${STELE_AUTH_DEFAULT_NAMESPACE:-namespace-a}
      STELE_JOBS_MAINTENANCE_INTERVAL: 30s
      STELE_JOBS_SUMMARY_COMPACTION_INTERVAL: 30s
      STELE_JOBS_RETENTION_INTERVAL: 30s
      STELE_JOBS_CLEANUP_INTERVAL: 30s
      STELE_JOBS_JOB_EXECUTION_RETENTION: 168h
      STELE_JOBS_WORKER_POLL_INTERVAL: 5s
      STELE_JOBS_WORKER_ERROR_BACKOFF: 15s
      STELE_JOBS_SCHEDULER_ERROR_BACKOFF: 30s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  stele-postgres-data:
