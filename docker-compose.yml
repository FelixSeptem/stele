services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: stele
      POSTGRES_PASSWORD: stele
      POSTGRES_DB: stele
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stele -d stele"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - stele-postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      STELE_MODE: api
      STELE_HTTP_ADDR: :8080
      STELE_POSTGRES_DSN: postgres://stele:stele@postgres:5432/stele?sslmode=disable
      STELE_AUTH_API_KEYS: dev-public-key
      STELE_AUTH_ADMIN_API_KEYS: dev-admin-key
      STELE_AUTH_DEFAULT_TENANT: tenant-a
      STELE_AUTH_DEFAULT_PROJECT: project-a
      STELE_AUTH_DEFAULT_NAMESPACE: namespace-a
      STELE_JOBS_MAINTENANCE_INTERVAL: 30s
      STELE_JOBS_SUMMARY_COMPACTION_INTERVAL: 30s
      STELE_JOBS_RETENTION_INTERVAL: 30s
      STELE_JOBS_CLEANUP_INTERVAL: 30s
      STELE_JOBS_JOB_EXECUTION_RETENTION: 168h
      STELE_JOBS_WORKER_POLL_INTERVAL: 5s
      STELE_JOBS_WORKER_ERROR_BACKOFF: 15s
      STELE_JOBS_SCHEDULER_ERROR_BACKOFF: 30s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
    restart: unless-stopped
    environment:
      STELE_MODE: worker
      STELE_POSTGRES_DSN: postgres://stele:stele@postgres:5432/stele?sslmode=disable
      STELE_AUTH_API_KEYS: dev-public-key
      STELE_AUTH_ADMIN_API_KEYS: dev-admin-key
      STELE_AUTH_DEFAULT_TENANT: tenant-a
      STELE_AUTH_DEFAULT_PROJECT: project-a
      STELE_AUTH_DEFAULT_NAMESPACE: namespace-a
      STELE_JOBS_MAINTENANCE_INTERVAL: 30s
      STELE_JOBS_SUMMARY_COMPACTION_INTERVAL: 30s
      STELE_JOBS_RETENTION_INTERVAL: 30s
      STELE_JOBS_CLEANUP_INTERVAL: 30s
      STELE_JOBS_JOB_EXECUTION_RETENTION: 168h
      STELE_JOBS_WORKER_POLL_INTERVAL: 5s
      STELE_JOBS_WORKER_ERROR_BACKOFF: 15s
      STELE_JOBS_SCHEDULER_ERROR_BACKOFF: 30s
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
    restart: unless-stopped
    environment:
      STELE_MODE: scheduler
      STELE_POSTGRES_DSN: postgres://stele:stele@postgres:5432/stele?sslmode=disable
      STELE_AUTH_API_KEYS: dev-public-key
      STELE_AUTH_ADMIN_API_KEYS: dev-admin-key
      STELE_AUTH_DEFAULT_TENANT: tenant-a
      STELE_AUTH_DEFAULT_PROJECT: project-a
      STELE_AUTH_DEFAULT_NAMESPACE: namespace-a
      STELE_JOBS_MAINTENANCE_INTERVAL: 30s
      STELE_JOBS_SUMMARY_COMPACTION_INTERVAL: 30s
      STELE_JOBS_RETENTION_INTERVAL: 30s
      STELE_JOBS_CLEANUP_INTERVAL: 30s
      STELE_JOBS_JOB_EXECUTION_RETENTION: 168h
      STELE_JOBS_WORKER_POLL_INTERVAL: 5s
      STELE_JOBS_WORKER_ERROR_BACKOFF: 15s
      STELE_JOBS_SCHEDULER_ERROR_BACKOFF: 30s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  stele-postgres-data:
