schema: spec-driven

context: |
  Project: Stele - An agent memory service for easy to use
  Tech stack: Golang
  Domain: AI agent memory management and coordination
  Multi-agent support: Claude, Codex, Cursor, Gemini, OpenCode, Trae
  Workflow: OpenSpec change management (propose → explore → apply → archive)
  OpenSpec archive convention:
  - Do not manually rename directories under openspec/changes/archive
  - Archive active changes with `pwsh -File scripts/openspec-archive-seq.ps1 -ChangeName "<change-name>"`
  - Normalize legacy archive names with `pwsh -File scripts/openspec-archive-seq.ps1 -MigrateExisting`
  - Archive directories should use incrementing three-digit prefixes such as `001-change-name`
  - `openspec/changes/archive/INDEX.md` should be regenerated by the archive sequencing script

rules:
  proposal:
    - Always include "Non-goals" section
    - Link related skills/commands in artifact references

  tasks:
    - Break tasks into chunks of max 4 hours
    - Each task should be independently verifiable
