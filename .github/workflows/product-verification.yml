name: product-verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  real-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated PostgreSQL/pgvector product verification
        shell: pwsh
        env:
          STELE_PRODUCT_VERIFY_CI: "1"
        run: ./scripts/stele-product-verify.ps1
